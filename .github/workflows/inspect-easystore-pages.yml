name: Inspect public EasyStore page editor code
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/inspect_easystore_pages.py"
      - ".github/workflows/inspect-easystore-pages.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python .github/scripts/inspect_easystore_pages.py
