name: Deploy EasyStore theme

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystore-theme-import
  cancel-in-progress: false

env:
  EASYSTORE_API_URL: https://api.easystore.co/admin/v2/store/themes/assets/import
  EASYSTORE_POD_ID: ${{ vars.EASYSTORE_POD_ID || '1007' }}
  EASYSTORE_STORE_DOMAIN: ${{ vars.EASYSTORE_STORE_DOMAIN || 'cardboardcollective.easy.co' }}

jobs:
  deploy:
    name: Validate, package, and import theme
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate the real theme
        run: python scripts/theme_ci.py check theme

      - name: Run tests with 100% line and branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

      - name: Create EasyStore upload ZIP
        run: |
          set -euo pipefail
          python scripts/theme_ci.py package theme cc-ez-theme.zip
          test -s cc-ez-theme.zip
          python -c "from scripts.theme_ci import validate_archive; errors = validate_archive('cc-ez-theme.zip'); assert not errors, errors"

      - name: Import theme into EasyStore
        env:
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${EASYSTORE_ADMIN_TOKEN}" ]]; then
            echo "::error::Missing repository secret EASYSTORE_ADMIN_TOKEN."
            exit 1
          fi

          idempotency_key="phase1-dummy:web:$(python -c 'import uuid; print(uuid.uuid4())')"

          http_code="$(
            curl --silent --show-error \
              --request POST "${EASYSTORE_API_URL}" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${EASYSTORE_ADMIN_TOKEN}" \
              --header "easystore-pod-id: ${EASYSTORE_POD_ID}" \
              --header "easystore-source: admin" \
              --header "x-easystore-infra-default-domain: ${EASYSTORE_STORE_DOMAIN}" \
              --header "x-easystore-infra-pod-id: ${EASYSTORE_POD_ID}" \
              --header "x-easystore-infra-source: admin" \
              --header "idempotency-key: ${idempotency_key}" \
              --form "file=@cc-ez-theme.zip;type=application/zip" \
              --output easystore-response.json \
              --write-out "%{http_code}"
          )"

          echo "EasyStore import HTTP status: ${http_code}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::EasyStore theme import failed."
            if [[ -s easystore-response.json ]]; then
              cat easystore-response.json
            fi
            exit 1
          fi

          {
            echo "### EasyStore theme import"
            echo
            echo "- HTTP status: \`${http_code}\`"
            echo "- Store domain: \`${EASYSTORE_STORE_DOMAIN}\`"
            echo "- Package SHA-256: \`$(sha256sum cc-ez-theme.zip | cut -d ' ' -f 1)\`"
            echo
            echo "The theme was imported but not automatically published."
          } >> "${GITHUB_STEP_SUMMARY}"
