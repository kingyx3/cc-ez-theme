name: Package EasyStore theme PR check

on:
  pull_request:
    paths:
      - "theme/**"
      - "tests/**"
      - "scripts/theme_ci.py"
      - "requirements-dev.txt"
      - ".coveragerc"
      - ".github/workflows/package-theme-pr.yml"

permissions:
  contents: read

jobs:
  test:
    name: Validate theme and enforce 100% coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate the real theme
        run: python scripts/theme_ci.py check theme

      - name: Run tests with 100% line and branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
