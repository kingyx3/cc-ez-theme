name: Apply Star Trek homepage fix

on:
  push:
    branches:
      - fix/star-trek-homepage-nav
    paths:
      - .github/workflows/apply-star-trek-homepage-fix.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/star-trek-homepage-nav
          fetch-depth: 0

      - name: Update homepage sections and tests
        shell: python
        run: |
          from copy import deepcopy
          from pathlib import Path
          import json
          import re

          STAR_TREK_ID = "1787270400000"
          REALITY_FRACTURE_ID = "1787270400001"
          BEST_SELLERS_ID = "1667498127486"

          for relative in (
              "theme/config/settings_data.json",
              "theme/editor_config/settings_data.json",
          ):
              path = Path(relative)
              data = json.loads(path.read_text(encoding="utf-8"))
              homepage = data["presets"]["editor"]
              sections = homepage["sections"]

              star_trek = sections[STAR_TREK_ID]
              star_trek["settings"].update({
                  "eyebrow": "PRE-ORDER NOW OPEN",
                  "title": "Star Trek Collection",
                  "subtitle": "Explore Star Trek pre-orders before release.",
                  "collection__id": "star-trek",
              })

              reality = deepcopy(star_trek)
              reality["settings"].update({
                  "eyebrow": "REALITY FRACTURE",
                  "title": "Reality Fracture",
                  "subtitle": "Explore the latest Reality Fracture products.",
                  "collection__id": "reality-fracture",
              })

              ordered = {}
              for section_id, section in sections.items():
                  ordered[section_id] = section
                  if section_id == STAR_TREK_ID:
                      ordered[REALITY_FRACTURE_ID] = reality
              homepage["sections"] = ordered

              remainder = [
                  section_id for section_id in homepage["content_for_index"]
                  if section_id not in (BEST_SELLERS_ID, STAR_TREK_ID, REALITY_FRACTURE_ID)
              ]
              homepage["content_for_index"] = [
                  BEST_SELLERS_ID,
                  STAR_TREK_ID,
                  REALITY_FRACTURE_ID,
                  *remainder,
              ]

              path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          test_path = Path("tests/test_storefront_configuration.py")
          test = test_path.read_text(encoding="utf-8")

          if '"1787270400001": (' not in test:
              pattern = re.compile(
                  r'(            "1787270400000": \(\n'
                  r'                "Star Trek Collection",\n'
                  r'                "star-trek",\n'
                  r'                3,\n'
                  r'            \),\n)'
              )
              replacement = (
                  r'\1'
                  '            "1787270400001": (\n'
                  '                "Reality Fracture",\n'
                  '                "reality-fracture",\n'
                  '                3,\n'
                  '            ),\n'
              )
              test, count = pattern.subn(replacement, test, count=1)
              if count != 1:
                  raise RuntimeError("Could not add Reality Fracture expected homepage section")

          order_anchor = '                "1787270400000",\n                "1684403242688",'
          if '                "1787270400001",' not in test:
              if order_anchor not in test:
                  raise RuntimeError("Could not locate homepage section-order assertion")
              test = test.replace(
                  order_anchor,
                  '                "1787270400000",\n'
                  '                "1787270400001",\n'
                  '                "1684403242688",',
                  1,
              )

          test_path.write_text(test, encoding="utf-8")

      - name: Run storefront configuration tests
        run: python -m unittest tests.test_storefront_configuration

      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/config/settings_data.json theme/editor_config/settings_data.json tests/test_storefront_configuration.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Keep Reality Fracture and add Star Trek homepage section"
          git push origin HEAD:fix/star-trek-homepage-nav
