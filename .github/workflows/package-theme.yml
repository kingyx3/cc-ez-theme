name: Package EasyStore theme

on:
  push:
    branches:
      - "**"
    # Theme sources and the tooling, tests and dependencies that gate them.
    # CRM sync changes have their own workflow and must not repackage, import
    # or republish the storefront theme.
    paths:
      - "theme/**"
      - "tests/**"
      - "scripts/theme_ci.py"
      - "scripts/easystore_publish.py"
      - "requirements-dev.txt"
      - ".coveragerc"
      - ".github/workflows/package-theme.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EASYSTORE_API_URL: https://api.easystore.co/admin/v2/store/themes/assets/import
  EASYSTORE_THEMES_API_URL: https://api.easystore.co/admin/v2/store/themes

jobs:
  test:
    name: Validate theme and enforce 100% coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate the real theme
        run: python scripts/theme_ci.py check theme

      - name: Run tests with 100% line and branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

  package:
    name: Build downloadable theme ZIP
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Create EasyStore upload ZIP
        shell: bash
        run: |
          set -euo pipefail

          python scripts/theme_ci.py package theme cc-ez-theme.zip
          test -s cc-ez-theme.zip

          mkdir easystore-artifact
          python -m zipfile -e cc-ez-theme.zip easystore-artifact
          python scripts/theme_ci.py check easystore-artifact/cc-ez-theme

          {
            echo "### EasyStore theme package"
            echo
            echo "Download the \`cc-ez-theme\` artifact and upload that ZIP directly to EasyStore if a manual fallback is needed."
            echo
            echo "SHA-256: \`$(sha256sum cc-ez-theme.zip | cut -d ' ' -f 1)\`"
            echo
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "This run deploys through the GitHub \`prod\` environment because the source branch is \`main\`."
            else
              echo "This run deploys through the GitHub \`dev\` environment because the source branch is not \`main\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload theme package
        uses: actions/upload-artifact@v7
        with:
          name: cc-ez-theme
          path: easystore-artifact/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Import and publish packaged theme in EasyStore
    needs: package
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    concurrency:
      group: easystore-theme-import-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    env:
      EASYSTORE_POD_ID: ${{ vars.EASYSTORE_POD_ID }}
      EASYSTORE_STORE_DOMAIN: ${{ vars.EASYSTORE_STORE_DOMAIN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check EasyStore credential and environment variables
        id: credential
        env:
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          configured=true

          if [[ -z "${EASYSTORE_ADMIN_TOKEN}" ]]; then
            echo "::warning::EASYSTORE_ADMIN_TOKEN is not configured in the selected GitHub environment."
            configured=false
          fi
          if [[ -z "${EASYSTORE_POD_ID}" ]]; then
            echo "::warning::EASYSTORE_POD_ID is not configured in the selected GitHub environment."
            configured=false
          fi
          if [[ -z "${EASYSTORE_STORE_DOMAIN}" ]]; then
            echo "::warning::EASYSTORE_STORE_DOMAIN is not configured in the selected GitHub environment."
            configured=false
          fi

          echo "configured=${configured}" >> "${GITHUB_OUTPUT}"
          if [[ "${configured}" != "true" ]]; then
            echo "::warning::Package succeeded but automatic EasyStore import is skipped."
          fi

      - name: Derive deployment identity
        if: steps.credential.outputs.configured == 'true'
        id: identity
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          branch = os.environ["SOURCE_BRANCH"]
          short_sha = os.environ["SOURCE_SHA"][:7]
          run_number = os.environ["RUN_NUMBER"]

          slug = re.sub(r"[^A-Za-z0-9._-]+", "-", branch).strip("-._").lower()
          slug = (slug[:40].rstrip("-._") or "detached")

          schema = json.loads(Path("theme/config/settings_schema.json").read_text(encoding="utf-8"))
          base_version = str(schema.get("theme_version", "0.0.0")).split("+", 1)[0]

          release_match = re.fullmatch(
              r"(?:release|releases)/v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)",
              branch,
          )
          if release_match:
              release_version = release_match.group(1)
              display_name = f"CC v{release_version} {short_sha}"
              version = f"{release_version}+gh.{run_number}.{short_sha}"
          else:
              display_name = f"CC {slug} r{run_number} {short_sha}"
              version = f"{base_version}+gh.{run_number}.{short_sha}"

          package_filename = f"cc-ez-theme--{slug}--r{run_number}--{short_sha}.zip"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"display_name={display_name}", file=output)
              print(f"version={version}", file=output)
              print(f"package_filename={package_filename}", file=output)
          PY

      - name: Stamp deployment metadata and package
        if: steps.credential.outputs.configured == 'true'
        env:
          THEME_DISPLAY_NAME: ${{ steps.identity.outputs.display_name }}
          THEME_VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE_FILENAME: ${{ steps.identity.outputs.package_filename }}
        shell: bash
        run: |
          set -euo pipefail
          cp -a theme deploy-theme

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          display_name = os.environ["THEME_DISPLAY_NAME"]
          version = os.environ["THEME_VERSION"]

          for relative in (
              "config/settings_schema.json",
              "editor_config/settings_schema.json",
          ):
              path = Path("deploy-theme") / relative
              data = json.loads(path.read_text(encoding="utf-8"))
              data["theme"] = display_name
              if "theme_name" in data:
                  data["theme_name"] = display_name
              if "theme_version" in data:
                  data["theme_version"] = version
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

          python scripts/theme_ci.py check deploy-theme
          python scripts/theme_ci.py package deploy-theme "${PACKAGE_FILENAME}"
          test -s "${PACKAGE_FILENAME}"

      - name: Import theme into EasyStore
        if: steps.credential.outputs.configured == 'true'
        env:
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
          PACKAGE_FILENAME: ${{ steps.identity.outputs.package_filename }}
          THEME_DISPLAY_NAME: ${{ steps.identity.outputs.display_name }}
          THEME_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          idempotency_key="phase1-dummy:web:$(python -c 'import uuid; print(uuid.uuid4())')"

          http_code="$(
            curl --silent --show-error \
              --request POST "${EASYSTORE_API_URL}" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${EASYSTORE_ADMIN_TOKEN}" \
              --header "easystore-pod-id: ${EASYSTORE_POD_ID}" \
              --header "easystore-source: admin" \
              --header "x-easystore-infra-default-domain: ${EASYSTORE_STORE_DOMAIN}" \
              --header "x-easystore-infra-pod-id: ${EASYSTORE_POD_ID}" \
              --header "x-easystore-infra-source: admin" \
              --header "idempotency-key: ${idempotency_key}" \
              --form "file=@${PACKAGE_FILENAME};type=application/zip" \
              --output easystore-import.json \
              --write-out "%{http_code}"
          )"

          echo "EasyStore import HTTP status: ${http_code}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::EasyStore theme import failed."
            if [[ -s easystore-import.json ]]; then
              cat easystore-import.json
            fi
            exit 1
          fi

          {
            echo "### EasyStore automatic theme import"
            echo
            echo "- GitHub environment: \`${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}\`"
            echo "- Theme identity: \`${THEME_DISPLAY_NAME}\`"
            echo "- Theme version: \`${THEME_VERSION}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Package: \`${PACKAGE_FILENAME}\`"
            echo "- HTTP status: \`${http_code}\`"
            echo "- Store domain: \`${EASYSTORE_STORE_DOMAIN}\`"
            echo "- Package SHA-256: \`$(sha256sum "${PACKAGE_FILENAME}" | cut -d ' ' -f 1)\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The publish call targets one theme id, so the id has to be discovered
      # before anything is published. It is never hard-coded: an id observed once
      # in a browser session belongs to whichever theme owns it today, and
      # publishing that would take the wrong theme live.
      - name: Resolve the imported theme id
        if: steps.credential.outputs.configured == 'true'
        id: theme
        env:
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
          THEME_DISPLAY_NAME: ${{ steps.identity.outputs.display_name }}
          THEME_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          http_code="$(
            curl --silent --show-error \
              --request GET "${EASYSTORE_THEMES_API_URL}" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${EASYSTORE_ADMIN_TOKEN}" \
              --header "easystore-pod-id: ${EASYSTORE_POD_ID}" \
              --header "easystore-source: admin" \
              --header "x-easystore-infra-default-domain: ${EASYSTORE_STORE_DOMAIN}" \
              --header "x-easystore-infra-pod-id: ${EASYSTORE_POD_ID}" \
              --header "x-easystore-infra-source: admin" \
              --output easystore-themes.json \
              --write-out "%{http_code}"
          )" || http_code="000"

          echo "EasyStore theme listing HTTP status: ${http_code}"

          # A failed listing is not fatal on its own: the import response may
          # already carry the id. The resolver decides whether it knows enough.
          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::warning::EasyStore theme listing request returned ${http_code}."
            rm -f easystore-themes.json
          fi

          python scripts/easystore_publish.py resolve \
            --import-response easystore-import.json \
            --themes-response easystore-themes.json \
            --display-name "${THEME_DISPLAY_NAME}" \
            --version "${THEME_VERSION}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Publish theme in EasyStore
        if: steps.credential.outputs.configured == 'true'
        env:
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
          THEME_ID: ${{ steps.theme.outputs.theme_id }}
          THEME_ID_SOURCE: ${{ steps.theme.outputs.theme_id_source }}
          THEME_DISPLAY_NAME: ${{ steps.identity.outputs.display_name }}
          THEME_VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          idempotency_key="phase1-dummy:web:$(python -c 'import uuid; print(uuid.uuid4())')"

          http_code="$(
            curl --silent --show-error \
              --request PUT "${EASYSTORE_THEMES_API_URL}/${THEME_ID}" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${EASYSTORE_ADMIN_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "easystore-pod-id: ${EASYSTORE_POD_ID}" \
              --header "easystore-source: admin" \
              --header "x-easystore-infra-default-domain: ${EASYSTORE_STORE_DOMAIN}" \
              --header "x-easystore-infra-pod-id: ${EASYSTORE_POD_ID}" \
              --header "x-easystore-infra-source: admin" \
              --header "idempotency-key: ${idempotency_key}" \
              --data '{}' \
              --output easystore-publish.json \
              --write-out "%{http_code}"
          )"

          echo "EasyStore publish HTTP status: ${http_code}"

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::EasyStore theme publish failed for theme ${THEME_ID}."
            if [[ -s easystore-publish.json ]]; then
              cat easystore-publish.json
            fi
            exit 1
          fi

          curl --silent --show-error \
            --request GET "${EASYSTORE_THEMES_API_URL}" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${EASYSTORE_ADMIN_TOKEN}" \
            --header "easystore-pod-id: ${EASYSTORE_POD_ID}" \
            --header "easystore-source: admin" \
            --header "x-easystore-infra-default-domain: ${EASYSTORE_STORE_DOMAIN}" \
            --header "x-easystore-infra-pod-id: ${EASYSTORE_POD_ID}" \
            --header "x-easystore-infra-source: admin" \
            --output easystore-themes-after-publish.json || true

          {
            echo "### EasyStore automatic theme publish"
            echo
            echo "- GitHub environment: \`${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}\`"
            echo "- Theme id: \`${THEME_ID}\`"
            echo "- Theme id source: \`${THEME_ID_SOURCE}\`"
            echo "- Theme identity: \`${THEME_DISPLAY_NAME}\`"
            echo "- Theme version: \`${THEME_VERSION}\`"
            echo "- Publish endpoint: \`PUT ${EASYSTORE_THEMES_API_URL}/${THEME_ID}\`"
            echo "- HTTP status: \`${http_code}\`"
            echo "- Store domain: \`${EASYSTORE_STORE_DOMAIN}\`"
            echo
            echo "State EasyStore reports for the theme after publishing:"
            echo
            echo '```text'
            python scripts/easystore_publish.py describe \
              --themes-response easystore-themes-after-publish.json \
              --theme-id "${THEME_ID}"
            echo '```'
            echo
            echo "This theme is now live on the configured storefront."
          } >> "${GITHUB_STEP_SUMMARY}"
