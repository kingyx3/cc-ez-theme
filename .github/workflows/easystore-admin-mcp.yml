name: EasyStore admin MCP
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/easystore-admin-mcp/**'
      - '.github/workflows/easystore-admin-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/easystore-admin-mcp/**'
      - '.github/workflows/easystore-admin-mcp.yml'
  workflow_dispatch:
    inputs:
      enable_writes:
        description: Enable registered mutations for the writer connector key
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: easystore-admin-mcp-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/easystore-admin-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/easystore-admin-mcp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/easystore-admin-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
      MCP_READ_TOKEN: ${{ secrets.EASYSTORE_ADMIN_MCP_READ_TOKEN }}
      MCP_WRITE_TOKEN: ${{ secrets.EASYSTORE_ADMIN_MCP_WRITE_TOKEN }}
      ENABLE_WRITES: ${{ inputs.enable_writes && 'true' || 'false' }}
      LIVE_READ_CHECKS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Sync secrets, deploy and check authenticated MCP
        run: npm run deploy:gha
