name: Patch customer pagination guard test

on:
  push:
    branches:
      - fix/customer-pagination-boundary

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/customer-pagination-boundary

      - name: Update generic pagination guard endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crm_tests/test_crm_sync.py")
          text = path.read_text()
          start = text.index("    def test_the_error_names_the_endpoint(self) -> None:")
          end = text.index("\n    def test_records_without_ids_still_terminate", start)
          block = text[start:end]
          assert block.count("customers.json") == 2, block
          block = block.replace("customers.json", "products.json")
          path.write_text(text[:start] + block + text[end:])

          Path(".github/workflows/patch-customer-pagination-test.yml").unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crm_tests/test_crm_sync.py .github/workflows/patch-customer-pagination-test.yml
          git commit -m "Update pagination guard endpoint test"
          git push origin HEAD:fix/customer-pagination-boundary
