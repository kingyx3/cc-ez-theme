name: EasyStore browser E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: EasyStore storefront or preview URL to test
        required: false
        default: https://cardboard.sg
        type: string

permissions:
  contents: read

concurrency:
  group: easystore-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.E2E_PR_BASE_URL || vars.E2E_BASE_URL || 'https://cardboard.sg' }}
  E2E_LIMITED_PRODUCT_PATH: ${{ vars.E2E_LIMITED_PRODUCT_PATH || '/collections/feature-on-homepage/products/mtg-hob-cbb-en-pack' }}
  E2E_UNLIMITED_PRODUCT_PATH: ${{ vars.E2E_UNLIMITED_PRODUCT_PATH }}
  E2E_SEARCH_TERM: ${{ vars.E2E_SEARCH_TERM || 'Hobbit' }}

jobs:
  validate:
    name: Validate Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests_this_pr: ${{ steps.target.outputs.tests_this_pr }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Playwright test matrix
        run: npx playwright test --list

      # Whether the URL under test actually serves THIS pull request's theme.
      # A packaged theme is imported unpublished, so unless someone points
      # E2E_PR_BASE_URL at a preview hosting the branch build, these suites
      # measure the published storefront and say nothing about the diff.
      - name: Decide what the run is measuring
        id: target
        # Through env, never interpolated into the script: a repository variable
        # is settable by anyone with repo access and must not reach the shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_URL: ${{ vars.E2E_PR_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || -n "${PR_BASE_URL}" ]]; then
            echo "tests_this_pr=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tests_this_pr=false" >> "${GITHUB_OUTPUT}"
          fi

  preflight:
    name: Storefront preflight
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify storefront is reachable
        shell: bash
        run: |
          set -euo pipefail
          target="$E2E_BASE_URL"
          case "$target" in
            http://*|https://*) ;;
            *) target="https://$target" ;;
          esac
          status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$target")"
          echo "Storefront target: $target"
          echo "Storefront HTTP status: $status"
          test "$status" -ge 200
          test "$status" -lt 500

  functional:
    name: Functional / ${{ matrix.project }}
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Run storefront E2E
        id: e2e
        continue-on-error: ${{ needs.validate.outputs.tests_this_pr != 'true' }}
        run: npx playwright test e2e/storefront.spec.js --project="${{ matrix.project }}"

      - name: Report what the result means
        if: always()
        env:
          TESTS_THIS_PR: ${{ needs.validate.outputs.tests_this_pr }}
          OUTCOME: ${{ steps.e2e.outcome }}
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TESTS_THIS_PR}" == "true" ]]; then
            echo "Measured a URL serving this pull request's theme, so the result gates the diff."
            exit 0
          fi
          echo "### Functional / ${PROJECT}: measured the published storefront" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "\`E2E_PR_BASE_URL\` is not set, so this ran against \`${E2E_BASE_URL}\` - the live" >> "${GITHUB_STEP_SUMMARY}"
          echo "store, not this branch. A packaged theme is imported unpublished, so nothing here" >> "${GITHUB_STEP_SUMMARY}"
          echo "exercised the diff and the result cannot gate it." >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${OUTCOME}" == "failure" ]]; then
            echo "::warning title=Published storefront is failing::Functional/${PROJECT} failed against ${E2E_BASE_URL}. This is production, not this pull request - investigate the store."
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "**The published storefront is failing these checks.** Investigate the store." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  accessibility:
    name: Accessibility / chromium-desktop
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Axe accessibility suite
        id: e2e
        continue-on-error: ${{ needs.validate.outputs.tests_this_pr != 'true' }}
        run: npx playwright test e2e/accessibility.spec.js --project=chromium-desktop

      - name: Report what the result means
        if: always()
        env:
          TESTS_THIS_PR: ${{ needs.validate.outputs.tests_this_pr }}
          OUTCOME: ${{ steps.e2e.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TESTS_THIS_PR}" == "true" ]]; then
            echo "Measured a URL serving this pull request's theme, so the result gates the diff."
            exit 0
          fi
          echo "### Accessibility: measured the published storefront" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "\`E2E_PR_BASE_URL\` is not set, so this ran against \`${E2E_BASE_URL}\` - the live" >> "${GITHUB_STEP_SUMMARY}"
          echo "store, not this branch, and the result cannot gate the diff." >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${OUTCOME}" == "failure" ]]; then
            echo "::warning title=Published storefront is failing::Accessibility failed against ${E2E_BASE_URL}. This is production, not this pull request - investigate the store."
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "**The published storefront is failing these checks.** Investigate the store." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-accessibility
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-accessibility
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
