name: EasyStore browser E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: EasyStore storefront or preview URL to test
        required: false
        default: https://cardboard.sg
        type: string

permissions:
  contents: read

concurrency:
  group: easystore-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.E2E_PR_BASE_URL || vars.E2E_BASE_URL || 'https://cardboard.sg' }}
  # Left empty on purpose: the suite reads the theme's configured limits and
  # opens one of those products. Set the repository variable only to pin a
  # specific product.
  E2E_LIMITED_PRODUCT_PATH: ${{ vars.E2E_LIMITED_PRODUCT_PATH }}
  E2E_UNLIMITED_PRODUCT_PATH: ${{ vars.E2E_UNLIMITED_PRODUCT_PATH }}
  E2E_SEARCH_TERM: ${{ vars.E2E_SEARCH_TERM || 'Hobbit' }}

jobs:
  validate:
    name: Validate Playwright suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Compile Playwright test matrix
        run: npx playwright test --list

  preflight:
    name: Storefront preflight
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify storefront is reachable
        shell: bash
        run: |
          set -euo pipefail
          target="$E2E_BASE_URL"
          case "$target" in
            http://*|https://*) ;;
            *) target="https://$target" ;;
          esac
          status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$target")"
          echo "Storefront target: $target"
          echo "Storefront HTTP status: $status"
          test "$status" -ge 200
          test "$status" -lt 500

  functional:
    name: Functional / ${{ matrix.project }}
    needs: preflight
    runs-on: ubuntu-latest
    # Browser downloads and OS dependency installation are network-bound and can
    # exceed ten minutes on hosted runners. Keep enough headroom for the actual
    # storefront assertions rather than cancelling a green test before it runs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Run storefront E2E
        run: npx playwright test e2e/storefront.spec.js --project="${{ matrix.project }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  login-redirect:
    # Serves its own pages, so like the OTP suite it needs no storefront and
    # depends on validate rather than preflight: a shopper who is sent to sign
    # in has to come back to the product, and that must stay caught even when
    # the live store is unreachable.
    name: Login redirect regression
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run login redirect regression suite
        run: npx playwright test e2e/login-redirect.spec.js --project=chromium-desktop

      - name: Upload login redirect failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-login-redirect
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  purchase-limit-after-login:
    # Serves its own product, listing, cart, and account pages, so it needs no
    # storefront: a customer who signs in to buy something they have already
    # bought must be told so, and that must stay caught even when the live
    # store is unreachable.
    name: Purchase limit after login regression
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run purchase limit after login suite
        run: npx playwright test e2e/purchase-limit-after-login.spec.js --project=chromium-desktop

      - name: Upload purchase limit failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-purchase-limit-after-login
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  otp-autofill:
    # Runs a replica of the platform's one-time-code widget against the theme
    # module, so it needs no storefront and depends on validate rather than
    # preflight - the double-submit that broke signup must stay caught even when
    # the live store is unreachable.
    name: OTP autofill regression
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run OTP autofill regression suite
        run: npx playwright test e2e/otp-autofill.spec.js --project=chromium-desktop

      - name: Upload OTP autofill failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-otp-autofill
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  accessibility:
    name: Accessibility / chromium-desktop
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Axe accessibility suite
        run: npx playwright test e2e/accessibility.spec.js --project=chromium-desktop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-accessibility
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-accessibility
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14