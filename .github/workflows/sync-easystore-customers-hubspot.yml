name: Sync EasyStore CRM data to HubSpot

on:
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystore-hubspot-crm-sync
  cancel-in-progress: false

env:
  EASYSTORE_STORE_DOMAIN: ${{ vars.EASYSTORE_STORE_DOMAIN || 'cardboardcollective.easy.co' }}
  CUSTOMER_SYNC_DEFAULT_DIAL_CODE: ${{ vars.CUSTOMER_SYNC_DEFAULT_DIAL_CODE || '65' }}

jobs:
  sync:
    name: Upsert EasyStore products and customers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate sync scripts
        run: |
          python -m py_compile scripts/easystore_hubspot_products.py
          python -m py_compile scripts/easystore_hubspot_sync.py

      - name: Check CRM sync credentials
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EASYSTORE_ACCESS_TOKEN}" ]]; then
            echo "::error::EASYSTORE_ACCESS_TOKEN is required with EasyStore read_products and read_customers scopes."
            exit 1
          fi
          if [[ -z "${HUBSPOT_ACCESS_TOKEN}" ]]; then
            echo "::error::HUBSPOT_ACCESS_TOKEN is required with crm.objects.products.read/write and crm.objects.contacts.read/write scopes."
            exit 1
          fi

      - name: Pull EasyStore products and upsert HubSpot products
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_products.py | tee product-sync-summary.json

      - name: Pull EasyStore customers and upsert HubSpot contacts
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_sync.py | tee customer-sync-summary.json

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "### EasyStore → HubSpot CRM sync"
            echo
            echo "- Schedule: 00:00, 06:00, 12:00, 18:00 Asia/Singapore"
            echo "- Products: one HubSpot Product per EasyStore variant, keyed by SKU"
            echo "- Customers: keyed by normalized mobile number"
            echo "- Store: \`${EASYSTORE_STORE_DOMAIN}\`"
            echo
            echo "#### Products"
            if [[ -s product-sync-summary.json ]]; then
              echo '```json'
              cat product-sync-summary.json
              echo '```'
            else
              echo "No product sync summary was produced; inspect the failed step above."
            fi
            echo
            echo "#### Customers"
            if [[ -s customer-sync-summary.json ]]; then
              echo '```json'
              cat customer-sync-summary.json
              echo '```'
            else
              echo "No customer sync summary was produced; inspect the failed step above."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
