name: Sync EasyStore CRM data to HubSpot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-easystore-customers-hubspot.yml"
      - "scripts/easystore_hubspot_*.py"
      - "scripts/cloudflare_hubspot_attribution.py"
      - "crm_tests/**"
      - "docs/CUSTOMER_CRM_SYNC.md"
      - "docs/EASYSTORE_CHECKOUT_CART_SYNC.md"
      - "docs/SOURCE_ATTRIBUTION.md"
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystore-hubspot-crm-sync-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

env:
  EASYSTORE_STORE_DOMAIN: ${{ vars.EASYSTORE_STORE_DOMAIN || 'cardboardcollective.easy.co' }}
  CUSTOMER_SYNC_DEFAULT_DIAL_CODE: ${{ vars.CUSTOMER_SYNC_DEFAULT_DIAL_CODE || '65' }}

jobs:
  validate:
    name: Validate CRM sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile CRM sync scripts
        run: |
          python -m py_compile scripts/easystore_hubspot_schema.py
          python -m py_compile scripts/easystore_hubspot_products.py
          python -m py_compile scripts/easystore_hubspot_sync.py
          python -m py_compile scripts/easystore_hubspot_customer_sync.py
          python -m py_compile scripts/easystore_hubspot_orders.py
          python -m py_compile scripts/easystore_hubspot_carts.py
          python -m py_compile scripts/easystore_hubspot_commerce.py
          python -m py_compile scripts/easystore_hubspot_checkouts.py
          python -m py_compile scripts/easystore_hubspot_preflight.py
          python -m py_compile scripts/easystore_hubspot_reconcile.py
          python -m py_compile scripts/cloudflare_hubspot_attribution.py

      - name: Run CRM sync unit tests
        run: python -m unittest discover -s crm_tests -v

  sync:
    name: Upsert EasyStore CRM data
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    # This store's Checkout collection is 1246 sessions, so the Cart stage writes
    # thousands of HubSpot requests on a first full run. The concurrency group
    # above already stops two of these overlapping.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check CRM sync credentials
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EASYSTORE_ACCESS_TOKEN}" ]]; then
            echo "::error::EASYSTORE_ACCESS_TOKEN is required."
            exit 1
          fi
          if [[ -z "${HUBSPOT_ACCESS_TOKEN}" ]]; then
            echo "::error::HUBSPOT_ACCESS_TOKEN is required with product/contact/order/cart/line-item read+write scopes and CRM schema read/write scopes."
            exit 1
          fi

      - name: Preflight customer mobile identity
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_preflight.py | tee preflight-summary.json

      - name: Pull EasyStore products and upsert HubSpot products
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_products.py | tee product-sync-summary.json

      - name: Pull EasyStore customers and upsert HubSpot contacts
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_customer_sync.py | tee customer-sync-summary.json

      - name: Pull EasyStore orders and upsert HubSpot orders and line items
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_orders.py | tee order-sync-summary.json

      - name: Reconcile removed EasyStore order lines
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_reconcile.py | tee reconcile-summary.json

      # EasyStore Checkout is the sole Cart data source. The collection request
      # intentionally sends only page + limit because EasyStore's published
      # Checkout parameter table contains obvious copied Product filters. The
      # read is retried and falls back to the smallest documented page size; an
      # endpoint that still never answers annotates the run and leaves existing
      # HubSpot Carts untouched instead of failing the CRM sync that already
      # wrote Products, Customers and Orders. Set EASYSTORE_CHECKOUTS_REQUIRED
      # to 1 to make that outage fail this step instead.
      - name: Sync EasyStore checkouts to HubSpot carts and cart line items
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_checkouts.py | tee cart-sync-summary.json

      # Last, for the same reason abandoned checkouts run late: this is the only
      # stage that depends on a third system and on provisioning new HubSpot
      # properties, so a store where either is unavailable must not lose its
      # Orders, Line Items, Reconciliation or Carts to it. It reads no EasyStore
      # data - the click id is already on the contact by now, and D1 holds the
      # channel - so nothing above depends on it either.
      #
      # It still fails loudly rather than degrading. Without somewhere to store
      # the acquisition click id, a rerun could not tell an already-attributed
      # contact from a new one, and silently rewriting them every six hours is
      # worse than a red run. Missing Cloudflare credentials are the one case
      # treated as "not configured" rather than broken.
      - name: Join Cloudflare source clicks to HubSpot contacts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::notice::Cloudflare credentials are not configured; source attribution was skipped."
            exit 0
          fi
          python scripts/cloudflare_hubspot_attribution.py | tee attribution-summary.json

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "### EasyStore → HubSpot CRM sync"
            echo
            echo "- Schedule: 00:00, 06:00, 12:00, 18:00 Asia/Singapore"
            echo "- Products: one HubSpot Product per EasyStore variant, keyed by SKU"
            echo "- Customers: keyed by normalized mobile number; ambiguous ownership fails before writes"
            echo "- Source attribution: Cloudflare click ids on contacts resolved against D1; an acquisition is written once and never overwritten"
            echo "- Customer notes: Customer.note + Customer.note2 only; Order notes remain separate"
            echo "- Orders: keyed by immutable EasyStore order ID with product-backed Line Items"
            echo "- Carts: every EasyStore Checkout session is synchronized to a HubSpot Cart using checkout.cart_token"
            echo "- Abandoned carts: unpaid/open Checkouts are the abandoned subset, flagged on the Cart; paid/completed Checkouts remain Carts with their source status and can associate to Orders"
            echo "- Checkout list request: /api/3.0/checkouts.json with page + limit only; no sort/date/Product-style filters, retried with backoff and falling back to limit=1"
            echo "- Checkout pagination: page 2 is unusable (repeats page 1, or hangs), so a larger limit on page 1 proves the snapshot; the page that answered is kept either way, and a snapshot EasyStore will not prove complete is still synchronized and annotated"
            echo "- Checkout outage: Cart and Cart Line Item writes pause and the run is annotated; existing Cart→Order links still refresh from order.cart_token"
            echo "- Cart lines: real Checkout line_items become separate product-backed HubSpot Cart Line Items"
            echo "- Retired variants: a Checkout line with no HubSpot Product is skipped and counted, keeping the Cart; the Order stage still fails on one"
            echo "- Store: \`${EASYSTORE_STORE_DOMAIN}\`"
            echo
            for entry in \
              "Preflight|preflight-summary.json" \
              "Products|product-sync-summary.json" \
              "Customers|customer-sync-summary.json" \
              "Orders and line items|order-sync-summary.json" \
              "Reconciliation|reconcile-summary.json" \
              "Carts / abandoned carts and cart lines|cart-sync-summary.json" \
              "Cloudflare source attribution|attribution-summary.json"; do
              title="${entry%%|*}"
              file="${entry#*|}"
              echo "#### ${title}"
              if [[ -s "${file}" ]]; then
                echo '```json'
                cat "${file}"
                echo '```'
              else
                echo "No summary was produced; inspect the relevant step above."
              fi
              echo
            done
          } >> "${GITHUB_STEP_SUMMARY}"
