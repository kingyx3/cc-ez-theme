name: Sync EasyStore CRM data to HubSpot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sync-easystore-customers-hubspot.yml"
      - "scripts/easystore_hubspot_*.py"
      - "scripts/cloudflare_hubspot_attribution.py"
      - "crm_tests/**"
      - "docs/CUSTOMER_CRM_SYNC.md"
      - "docs/EASYSTORE_CHECKOUT_CART_SYNC.md"
      - "docs/SOURCE_ATTRIBUTION.md"
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:
    inputs:
      deployment_env:
        description: GitHub environment to sync
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

# CRM writes use GitHub Environments to select the store and credentials.
# Scheduled runs fan out to both prod and dev at the same cadence. Manual runs
# explicitly select dev/prod (default dev), regardless of the branch/ref used to
# dispatch the workflow. Environment-scoped vars/secrets avoid PROD_/DEV_ prefixes.

jobs:
  validate:
    name: Validate CRM sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile CRM sync scripts
        run: |
          python -m py_compile scripts/easystore_hubspot_schema.py
          python -m py_compile scripts/easystore_hubspot_products.py
          python -m py_compile scripts/easystore_hubspot_ordered_products.py
          python -m py_compile scripts/easystore_hubspot_sync.py
          python -m py_compile scripts/easystore_hubspot_customer_sync.py
          python -m py_compile scripts/easystore_hubspot_contact_identity.py
          python -m py_compile scripts/easystore_hubspot_orders.py
          python -m py_compile scripts/easystore_hubspot_order_sync.py
          python -m py_compile scripts/easystore_hubspot_carts.py
          python -m py_compile scripts/easystore_hubspot_commerce.py
          python -m py_compile scripts/easystore_admin_checkouts.py
          python -m py_compile scripts/easystore_hubspot_checkouts.py
          python -m py_compile scripts/easystore_hubspot_checkout_sync.py
          python -m py_compile scripts/easystore_hubspot_preflight.py
          python -m py_compile scripts/easystore_hubspot_reconcile.py
          python -m py_compile scripts/cloudflare_hubspot_attribution.py

      - name: Run CRM sync unit tests
        run: python -m unittest discover -s crm_tests -v

  sync:
    name: Upsert EasyStore CRM data (${{ matrix.deployment_env }})
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Schedules execute from the default branch, so explicitly fan out to
        # both environment-scoped stores. workflow_dispatch uses the selected
        # input instead of inferring the environment from the chosen branch.
        deployment_env: ${{ fromJSON(github.event_name == 'schedule' && '["prod","dev"]' || format('["{0}"]', inputs.deployment_env || 'dev')) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.deployment_env }}
    concurrency:
      group: easystore-hubspot-crm-sync-${{ matrix.deployment_env }}
      cancel-in-progress: false
    # Environment variables are deliberately resolved at the job level, after
    # GitHub has selected dev/prod. EASYSTORE_STORE_DOMAIN has no repository-wide
    # fallback because pointing a CRM sync at the wrong store is unsafe.
    env:
      DEPLOYMENT_ENV: ${{ matrix.deployment_env }}
      EASYSTORE_STORE_DOMAIN: ${{ vars.EASYSTORE_STORE_DOMAIN }}
    # Phone normalization uses the scripts' built-in Singapore +65 default.
    # This is store-wide behavior, not deployment-specific configuration.
    # This store's Checkout collection is 1246 sessions, so the Cart stage writes
    # thousands of HubSpot requests on a first full run. The environment-specific
    # concurrency group above stops overlapping writes to the same target while
    # allowing dev and prod to sync independently.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check CRM sync environment
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EASYSTORE_STORE_DOMAIN}" ]]; then
            echo "::error::EASYSTORE_STORE_DOMAIN is required as a variable in the ${DEPLOYMENT_ENV} GitHub environment."
            exit 1
          fi
          if [[ -z "${EASYSTORE_ACCESS_TOKEN}" ]]; then
            echo "::error::EASYSTORE_ACCESS_TOKEN is required as a secret in the ${DEPLOYMENT_ENV} GitHub environment for EasyStore's public /api/3.0 endpoints."
            exit 1
          fi
          if [[ -z "${EASYSTORE_ADMIN_TOKEN}" ]]; then
            echo "::error::EASYSTORE_ADMIN_TOKEN is required as a secret in the ${DEPLOYMENT_ENV} GitHub environment for EasyStore's admin/v2 checkout endpoint."
            exit 1
          fi
          if [[ -z "${HUBSPOT_ACCESS_TOKEN}" ]]; then
            echo "::error::HUBSPOT_ACCESS_TOKEN is required as a secret in the ${DEPLOYMENT_ENV} GitHub environment with product/contact/order/cart/line-item read+write scopes and CRM schema read/write scopes."
            exit 1
          fi
          echo "Using GitHub environment ${DEPLOYMENT_ENV} for store ${EASYSTORE_STORE_DOMAIN}."

      # Preflight is the one stage that must stop the others. It proves the
      # normalized EasyStore mobile maps unambiguously through HubSpot's primary
      # Phone property. mobilephone is a synchronized mirror, not a second
      # identity namespace. Everything after preflight runs independently: a
      # stage that fails is reported and the rest of the CRM still syncs, because
      # one unreachable upstream endpoint is not a reason to leave Products,
      # Contacts, Orders and Carts a day stale. The final step fails the run.
      - name: Preflight customer mobile identity
        id: preflight
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_preflight.py | tee preflight-summary.json

      - name: Pull ordered EasyStore products and upsert HubSpot products
        id: products
        continue-on-error: true
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_ordered_products.py | tee product-sync-summary.json

      - name: Pull EasyStore customers and upsert HubSpot contacts
        id: customers
        continue-on-error: true
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_customer_sync.py | tee customer-sync-summary.json

      # Runs straight after Customers so a click id that arrived on a contact in
      # this run is joined in the same run. It needs no EasyStore access at all:
      # the click id is already in HubSpot by now, and D1 holds the channel.
      #
      # Cloudflare credentials are optional here on purpose. The join is the only
      # stage that needs them, and a run without them must not cost the store its
      # Products, Contacts, Orders or Carts.
      - name: Join Cloudflare source clicks to HubSpot contacts
        id: attribution
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::notice::Cloudflare credentials are not configured in ${DEPLOYMENT_ENV}; source attribution was skipped."
            exit 0
          fi
          python scripts/cloudflare_hubspot_attribution.py | tee attribution-summary.json

      - name: Pull EasyStore orders and upsert HubSpot orders and line items
        id: orders
        continue-on-error: true
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_order_sync.py | tee order-sync-summary.json

      - name: Reconcile removed EasyStore order lines
        id: reconcile
        continue-on-error: true
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_reconcile.py | tee reconcile-summary.json

      # EasyStore's admin checkout collection is the preferred Cart source. It
      # is the abandoned checkout list itself - 15 records against the public
      # route's 1267 sessions - and names customer_id on every record.
      #
      # The two API surfaces use separate credentials by design:
      # EASYSTORE_ADMIN_TOKEN is sent only to api.easystore.co/admin/v2, while
      # EASYSTORE_ACCESS_TOKEN is used only for the public /api/3.0 endpoints.
      # Admin records are not re-hydrated through the public Checkout detail
      # route; because the admin list has no line_items, existing HubSpot Cart
      # Line Items are preserved rather than deleted from an empty read.
      - name: Sync EasyStore checkouts to HubSpot carts and cart line items
        id: carts
        continue-on-error: true
        env:
          EASYSTORE_ACCESS_TOKEN: ${{ secrets.EASYSTORE_ACCESS_TOKEN }}
          EASYSTORE_ADMIN_TOKEN: ${{ secrets.EASYSTORE_ADMIN_TOKEN }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/easystore_hubspot_checkout_sync.py | tee cart-sync-summary.json

      - name: Publish run summary
        if: always()
        shell: bash
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PRODUCTS_OUTCOME: ${{ steps.products.outcome }}
          CUSTOMERS_OUTCOME: ${{ steps.customers.outcome }}
          ATTRIBUTION_OUTCOME: ${{ steps.attribution.outcome }}
          ORDERS_OUTCOME: ${{ steps.orders.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
          CARTS_OUTCOME: ${{ steps.carts.outcome }}
        run: |
          {
            echo "### EasyStore → HubSpot CRM sync"
            echo
            echo "- GitHub environment: \`${DEPLOYMENT_ENV}\`"
            echo "- Schedule: 00:00, 06:00, 12:00, 18:00 Asia/Singapore (both dev and prod)"
            echo "- Products: one HubSpot Product per EasyStore variant, keyed by SKU; only variants referenced by at least one EasyStore Order are synced"
            echo "- Customers: keyed by normalized HubSpot phone; mobilephone is mirror-only; ambiguous primary-phone ownership fails before writes"
            echo "- Source attribution: Cloudflare click ids on contacts resolved against D1; an acquisition is written once and never overwritten"
            echo "- Customer notes: Customer.note + Customer.note2 only; Order notes remain separate"
            echo "- Orders: keyed by immutable EasyStore order ID with product-backed Line Items"
            echo "- Carts: the unpaid, open EasyStore Checkout subset is synchronized to a HubSpot Cart using checkout.cart_token; a paid or converted Checkout is skipped because the Order stage already carries it"
            echo "- Abandoned carts: every Cart written by this stage is abandoned and flagged as such. checkouts.json serves open sessions only - its sole state field is financial_status, which reads unpaid throughout, and a session that converts leaves the collection instead of changing status - so all-unpaid Carts are the source, not a mapping fault"
            echo "- Cart status evidence: \`easystore_checkout_status_counts\` in the cart summary is the distribution of the raw status values EasyStore served, so an unexpected paid session shows up in the run itself"
            echo "- Cart to Contact: resolved by EasyStore customer ID first, then normalized HubSpot phone, then email; an identity matching two Contacts is reported, never guessed. Every Cart written lands in exactly one outcome and those outcomes sum to the Carts written, so an unlinked Cart always has a stated reason"
            echo "- Checkout credentials: public /api/3.0 requests use EASYSTORE_ACCESS_TOKEN; api.easystore.co/admin/v2 requests use EASYSTORE_ADMIN_TOKEN. The tokens are not exchanged between API surfaces"
            echo "- Checkout source: EasyStore's admin collection (api.easystore.co/admin/v2/store/checkouts) is tried first. It is the abandoned checkout list itself, declares total_count, names customer_id on every record, and reports is_recovered"
            echo "- Admin cart lines: the admin collection does not expose line_items, so Admin-source Carts are synchronized without a public Checkout-detail re-fetch; existing HubSpot Cart Line Items are preserved"
            echo "- Public fallback: if the admin collection is unavailable, the public /api/3.0/checkouts.json collection uses EASYSTORE_ACCESS_TOKEN and is filtered to sessions holding line items and naming a shopper"
            echo "- Public checkout list request: /api/3.0/checkouts.json with page + limit only; no sort/date/Product-style filters. Largest limit first (250, then 50, then 1), four attempts of 60s each, because this endpoint answers roughly one attempt in eight"
            echo "- Checkout pagination: page 2 is unusable (repeats page 1, or hangs), so a larger limit on page 1 proves the snapshot; the page that answered is kept either way, and a snapshot EasyStore will not prove complete is still synchronized and annotated"
            echo "- Checkout outage: Cart and Cart Line Item writes pause and the run is annotated; existing Cart→Order links still refresh from order.cart_token"
            echo "- Cart lines: public-fallback Checkout line_items become separate product-backed HubSpot Cart Line Items; Admin-source Carts preserve existing lines until an Admin API line-item source is available"
            echo "- Retired variants: a Checkout line with no HubSpot Product is skipped and counted, keeping the Cart; the Order stage still fails on one"
            echo "- Store: \`${EASYSTORE_STORE_DOMAIN}\`"
            echo
            echo "| Stage | Outcome |"
            echo "| --- | --- |"
            printf '| %s | %s |\n' \
              "Preflight" "${PREFLIGHT_OUTCOME:-skipped}" \
              "Products" "${PRODUCTS_OUTCOME:-skipped}" \
              "Customers" "${CUSTOMERS_OUTCOME:-skipped}" \
              "Cloudflare source attribution" "${ATTRIBUTION_OUTCOME:-skipped}" \
              "Orders and line items" "${ORDERS_OUTCOME:-skipped}" \
              "Reconciliation" "${RECONCILE_OUTCOME:-skipped}" \
              "Carts / abandoned carts and cart lines" "${CARTS_OUTCOME:-skipped}"
            echo
            for entry in \
              "Preflight|preflight-summary.json" \
              "Products|product-sync-summary.json" \
              "Customers|customer-sync-summary.json" \
              "Cloudflare source attribution|attribution-summary.json" \
              "Orders and line items|order-sync-summary.json" \
              "Reconciliation|reconcile-summary.json" \
              "Carts / abandoned carts and cart lines|cart-sync-summary.json"; do
              title="${entry%%|*}"
              file="${entry#*|}"
              echo "#### ${title}"
              if [[ -s "${file}" ]]; then
                echo '```json'
                cat "${file}"
                echo '```'
              else
                echo "No summary was produced; inspect the relevant step above."
              fi
              echo
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # continue-on-error above keeps a failed stage from cancelling the ones
      # after it, which also means it cannot fail the job on its own. This step
      # is what makes the run red, and it names every stage that failed rather
      # than only the first.
      - name: Fail the run if any stage failed
        if: always()
        shell: bash
        env:
          STAGE_OUTCOMES: >-
            Preflight=${{ steps.preflight.outcome }}
            Products=${{ steps.products.outcome }}
            Customers=${{ steps.customers.outcome }}
            Attribution=${{ steps.attribution.outcome }}
            Orders=${{ steps.orders.outcome }}
            Reconciliation=${{ steps.reconcile.outcome }}
            Carts=${{ steps.carts.outcome }}
        run: |
          set -euo pipefail
          failed=()
          for pair in ${STAGE_OUTCOMES}; do
            stage="${pair%%=*}"
            outcome="${pair#*=}"
            case "${outcome}" in
              success)
                echo "ok       ${stage}"
                ;;
              ""|skipped|cancelled)
                echo "skipped  ${stage} (${outcome:-not reached})"
                ;;
              *)
                echo "FAILED   ${stage} (${outcome})"
                echo "::error::The ${stage} stage of the ${DEPLOYMENT_ENV} CRM sync failed. Every other stage still ran; see this run's summary for what each one wrote."
                failed+=("${stage}")
                ;;
            esac
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::${DEPLOYMENT_ENV} CRM sync finished with ${#failed[@]} failed stage(s): ${failed[*]}."
            exit 1
          fi
          echo "Every ${DEPLOYMENT_ENV} CRM sync stage that ran succeeded."