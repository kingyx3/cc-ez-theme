name: Storefront performance observations

on:
  pull_request:
    paths:
      - "theme/**"
      - "tests/e2e/performance.spec.js"
      - "tests/e2e/storefront-helpers.js"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/performance-observability.yml"
  push:
    branches:
      - main
    paths:
      - "theme/**"
      - "tests/e2e/performance.spec.js"
      - "tests/e2e/storefront-helpers.js"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/performance-observability.yml"
  schedule:
    # A daily sample provides a stable time series even when the theme is quiet.
    # Offset from the top of the hour to avoid common hosted-runner traffic peaks.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: EasyStore storefront or preview URL to measure
        required: false
        default: https://cardboard.sg
        type: string
      samples:
        description: Cold and warm samples per scenario
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: easystore-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.E2E_PR_BASE_URL || vars.E2E_BASE_URL || 'https://cardboard.sg' }}
  E2E_LIMITED_PRODUCT_PATH: ${{ vars.E2E_LIMITED_PRODUCT_PATH }}
  PERF_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.samples || '3' }}
  PERF_RESULTS_DIR: performance-results

jobs:
  observe:
    name: Observe / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, mobile-chrome]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # The runner image ships a packages.microsoft.com apt source that
          # Playwright's browser dependencies do not need. When that repository
          # answers 403, `apt-get update` fails and takes every install with it.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null \
            | xargs -r sudo rm -f || true
          for attempt in 1 2; do
            if timeout --kill-after=30s 8m \
                npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt ${attempt} did not finish."
            sleep 15
          done
          echo "::error::Playwright browser install did not finish after two attempts."
          exit 1

      - name: Record storefront performance observations
        id: performance
        run: npx playwright test tests/e2e/performance.spec.js --project="${{ matrix.project }}" --workers=1 --retries=0

      - name: Validate recorded observations
        if: always()
        shell: bash
        run: |
          # A green observation job must mean the browser actually recorded
          # useful data; Playwright passing/skipping without a report is not enough.
          if [[ "${{ steps.performance.outcome }}" != "success" ]]; then
            echo "::error::Performance browser measurement failed."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'performance-results/metrics.json';
          if (!fs.existsSync(file)) {
            console.error('::error::No performance metrics artifact was produced.');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const minimum = Math.max(1, Math.ceil((report.sampleCount || 0) / 2));
          if (!report.scenarios?.length || !report.browserProject) {
            console.error('::error::Missing browser identity or route observations.');
            process.exit(1);
          }
          const incomplete = report.scenarios.filter(scenario =>
            (scenario.cold?.summary?.successfulSamples || 0) < minimum ||
            (scenario.warm?.summary?.successfulSamples || 0) < minimum ||
            !Number.isFinite(scenario.cold?.summary?.medians?.lcpMs)
          );
          if (incomplete.length) {
            console.error('::error::Insufficient successful performance samples: ' +
              incomplete.map(scenario => scenario.name).join(', '));
            process.exit(1);
          }
          console.log('Validated observations for ' + report.browserProject +
            ': ' + report.scenarios.length + ' routes, at least ' + minimum +
            ' successful cold and warm samples each.');
          NODE

      - name: Add observations to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f performance-results/summary.md ]]; then
            cat performance-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Storefront performance observations" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No metrics file was produced. Check the measurement step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance history artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storefront-performance-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 90
