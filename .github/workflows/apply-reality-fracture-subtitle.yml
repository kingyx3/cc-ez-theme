name: Apply Reality Fracture subtitle

on:
  push:
    branches:
      - fix/star-trek-homepage-nav
    paths:
      - .github/workflows/apply-reality-fracture-subtitle.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/star-trek-homepage-nav
          fetch-depth: 0

      - name: Update Reality Fracture subtitle
        shell: python
        run: |
          from pathlib import Path

          old = '"subtitle": "Explore the latest Reality Fracture products."'
          new = '"subtitle": "Reality is cracking. Collect what emerges."'
          for relative in (
              'theme/config/settings_data.json',
              'theme/editor_config/settings_data.json',
          ):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Could not find Reality Fracture subtitle in {relative}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Run storefront configuration tests
        run: python -m unittest tests.test_storefront_configuration tests.test_homepage_collection_components

      - name: Commit subtitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme/config/settings_data.json theme/editor_config/settings_data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Reality Fracture homepage subtitle"
          git push origin HEAD:fix/star-trek-homepage-nav
