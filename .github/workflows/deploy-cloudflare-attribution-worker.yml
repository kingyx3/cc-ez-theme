name: Deploy Cloudflare attribution Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/attribution-worker/**"
      - ".github/workflows/deploy-cloudflare-attribution-worker.yml"
  push:
    branches:
      - main
    paths:
      - "cloudflare/attribution-worker/**"
      - ".github/workflows/deploy-cloudflare-attribution-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    cloudflare-attribution-worker-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: cloudflare/attribution-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Worker JavaScript
        run: npm run check

      - name: Run Worker behaviour tests
        run: npm test

      - name: Prove D1 migrations are rerunnable
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          npm run d1:migrate:local
          npm run d1:migrate:local

  deploy:
    name: Migrate D1 and deploy Worker
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare/attribution-worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_ID: cc-attribution

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCESS_API_TOKEN}" ]]; then
            echo "::error::Configure CLOUDFLARE_ACCESS_API_TOKEN, or give CLOUDFLARE_API_TOKEN Access: Apps and Policies Write permission."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Worker JavaScript
        run: npm run check

      - name: Run Worker behaviour tests
        run: npm test

      - name: Validate Wrangler deployment bundle
        run: npx wrangler deploy --dry-run

      # Deployment ordering is deliberate: Wrangler's D1 migration ledger makes
      # this safe to rerun, and the Worker must never be deployed before its
      # schema is ready.
      - name: Apply pending D1 migrations before deployment
        run: npm run d1:migrate:remote

      - name: Confirm D1 migration step is idempotent
        run: npm run d1:migrate:remote

      - name: Deploy Worker only after migrations succeed
        run: npm run deploy

      # go.cardboard.sg is a public redirect/touch endpoint. Cloudflare account-
      # wide Worker Access must never turn it into an OTP-protected application.
      - name: Ensure attribution Worker bypasses Cloudflare Access
        run: npm run access:public

      - name: Verify public custom-domain health
        shell: bash
        run: |
          set -euo pipefail
          rm -f health.headers health.json
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --dump-header health.headers --output health.json --write-out '%{http_code}' --max-redirs 0 https://go.cardboard.sg/health || true)"
            if [[ "${status}" == "200" ]] && node -e '
              const fs = require("fs");
              const body = JSON.parse(fs.readFileSync("health.json", "utf8"));
              if (body.ok !== true || body.worker !== "cc-attribution") process.exit(1);
            '; then
              echo "Public health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Public health check attempt ${attempt} returned HTTP ${status:-curl-error}; retrying..."
            sleep 5
          done
          echo "::error::go.cardboard.sg/health did not reach cc-attribution without authentication."
          echo "--- response headers ---"
          cat health.headers || true
          echo "--- response body (first 1000 bytes) ---"
          head -c 1000 health.json || true
          echo
          exit 1

      - name: Write deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Cloudflare attribution Worker"
            echo
            echo "- Worker: \`cc-attribution\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- D1 migrations: applied before deployment and safe to rerun"
            echo "- Worker deployment: successful"
            echo "- Cloudflare Access: worker-level public bypass enforced"
            echo "- Public health: \`https://go.cardboard.sg/health\` reached \`cc-attribution\`"
          } >> "${GITHUB_STEP_SUMMARY}"
